name: iOS arranque (simulador)

jobs:
  build:
    type: build
    params:
      platform: ios
      profile: ios-sim

  iphone:
    needs: [build]
    type: maestro
    environment: production
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: .maestro/arranque.yml
      record_screen: true
    hooks:
      after_maestro_tests:
        - run: xcrun simctl spawn booted log show --last 5m --style compact --predicate 'process == "3C" AND (messageType == error OR messageType == fault OR subsystem CONTAINS "facebook" OR subsystem CONTAINS "expo")' | tail -300 || true

  ipad:
    needs: [build]
    type: maestro
    environment: production
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: .maestro/arranque.yml
      record_screen: true
      device_identifier:
        ios: iPad Air 11-inch (M3)
    hooks:
      after_maestro_tests:
        - run: xcrun simctl spawn booted log show --last 5m --style compact --predicate 'process == "3C" AND (messageType == error OR messageType == fault OR subsystem CONTAINS "facebook" OR subsystem CONTAINS "expo")' | tail -300 || true
