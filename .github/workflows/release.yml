name: Publicar app

# Un tag vX.Y.Z (igual a la versión de app.json) o "Run workflow" hace todo:
# despliega Convex, compila iOS en EAS, lo sube a TestFlight y lo manda a
# App Review. El lanzamiento queda MANUAL: una versión aprobada no se publica
# hasta tocar "Publicar" en App Store Connect (o `lanzar_al_aprobar`).
# En paralelo compila el APK de Android y lo publica como release
# `android-vX.Y.Z` con el asset 3C.apk (el sitio baja siempre el último).
#
# Los cambios solo de JS no necesitan esto: los publica "Actualizar app (OTA)".
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# Secrets: EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (repo) y
# CONVEX_DEPLOY_KEY (environment convex-test).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_existente:
        description: "Build ya subido a Apple: enviarlo a revisión sin compilar ni desplegar (opcional)"
        type: string
        default: ""
      enviar_a_revision:
        description: "Mandar a App Review después de subir a TestFlight"
        type: boolean
        default: true
      novedades:
        description: "Texto de Novedades para la App Store (opcional)"
        type: string
        default: ""
      lanzar_al_aprobar:
        description: "Publicar en la App Store apenas Apple la apruebe (si no, queda MANUAL)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  backend:
    if: ${{ !inputs.build_existente }}
    uses: ./.github/workflows/deploy-convex.yml
    secrets: inherit

  ios:
    name: iOS → TestFlight → App Review
    needs: backend
    if: ${{ !cancelled() && (needs.backend.result == 'success' || (needs.backend.result == 'skipped' && inputs.build_existente != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: El tag coincide con app.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con app.json ($version). Subí la versión en app.json antes de taggear."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        if: ${{ !inputs.build_existente }}
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --auto-submit sube el build a App Store Connect (TestFlight) con la key
      # de ASC guardada en EAS. Sin sync de capabilities: falla con App Groups.
      - name: Compilar y subir a TestFlight
        if: ${{ !inputs.build_existente }}
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          eas build --platform ios --profile production --non-interactive --auto-submit --wait --json > "$RUNNER_TEMP/ios-build.json"
          build_number=$(jq -er '.[0].appBuildVersion' "$RUNNER_TEMP/ios-build.json")
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Usar el build ya subido a Apple
        if: ${{ inputs.build_existente != '' }}
        env:
          EXISTING_BUILD: ${{ inputs.build_existente }}
        run: |
          if ! [[ "$EXISTING_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::El número de build debe contener solo dígitos."
            exit 1
          fi
          echo "BUILD_NUMBER=$EXISTING_BUILD" >> "$GITHUB_ENV"

      - name: Enviar a App Review
        if: github.ref_type == 'tag' || inputs.enviar_a_revision
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          NOVEDADES: ${{ inputs.novedades }}
          LANZAR_AL_APROBAR: ${{ inputs.lanzar_al_aprobar && '1' || '' }}
        run: node scripts/submit-app-review.mjs

  android:
    name: Android → APK en Releases
    needs: backend
    if: ${{ !cancelled() && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar APK
        run: |
          eas build --platform android --profile apk --non-interactive --wait --json > "$RUNNER_TEMP/android-build.json"
          url=$(jq -er '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/android-build.json")
          curl -fsSL "$url" -o "$RUNNER_TEMP/3C.apk"

      # El asset se llama 3C.apk: el sitio baja releases/latest/download/3C.apk.
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          NOVEDADES: ${{ inputs.novedades }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="android-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/3C.apk" --clobber
          else
            notes="APK oficial de 3C: Biblia y Devocional AI para Android (todavía no está en Google Play). Misma versión que la $version del App Store.${NOVEDADES:+ $NOVEDADES} Descargalo desde https://luiscf1226.github.io/bible-ai-honduras/#descargar"
            gh release create "$tag" "$RUNNER_TEMP/3C.apk" --target "$GITHUB_SHA" --latest --title "3C para Android $version" --notes "$notes"
          fi
